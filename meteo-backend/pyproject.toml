[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["."]
omit = ["db_migrations/*", "tests/*"]

[tool.coverage.report]
fail_under = 50
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "I001", "UP017", "UP045", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
