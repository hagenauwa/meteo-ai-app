name: Keepalive Render

on:
  schedule:
    - cron: '*/5 * * * *'   # ogni 5 minuti
  workflow_dispatch:          # avvio manuale dalla UI GitHub se necessario

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend Render
        run: |
          curl --fail --show-error --silent \
            --retry 3 --retry-delay 10 --retry-all-errors \
            https://meteo-ai-backend.onrender.com/ready
