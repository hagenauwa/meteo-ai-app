name: CI
on: [push, pull_request]
jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: pip install -r meteo-backend/requirements.txt
      - run: pip install pip-audit ruff
      - run: pip-audit -r meteo-backend/requirements.txt
      - run: ruff check . && ruff format --check .
        working-directory: meteo-backend
      - run: pytest --cov=. --cov-report=xml --cov-fail-under=60
        working-directory: meteo-backend

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx biome check public/js scripts tests/e2e
      - run: npm run build
      - run: npx playwright install --with-deps
      - name: Start frontend
        run: npx netlify dev > /tmp/netlify-dev.log 2>&1 &
      - name: Wait for frontend
        run: timeout 30s bash -c 'until curl --fail --silent http://localhost:8888 >/dev/null; do sleep 1; done'
      - run: npm run test:e2e
