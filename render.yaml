services:
  - type: web
    name: meteo-ai-backend
    runtime: python
    rootDir: meteo-backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m alembic -c alembic.ini upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        sync: false        # imposta manualmente su Render dashboard
      - key: ADMIN_API_TOKEN
        sync: false        # richiesto per /api/admin/* e /api/ml/train
      - key: FRONTEND_ORIGIN
        value: "https://leprevisioni.netlify.app"
      - key: APP_ENV
        value: "production"
      - key: ENABLE_SCHEDULER
        value: "false"
      - key: AUTO_LOAD_CITIES
        value: "false"
      - key: ML_CITY_SAMPLE_SIZE
        value: "800"
      - key: ML_CITY_CORE_SIZE
        value: "100"
      - key: ML_FORECAST_LEADS
        value: "1,3,6,14,38,86,158"
      - key: ML_CYCLE_EVERY_HOURS
        value: "1"
      - key: ML_OBSERVATION_RETENTION_DAYS
        value: "21"
      - key: ML_PREDICTION_RETENTION_DAYS
        value: "21"
      - key: PYTHON_VERSION
        value: "3.11.4"

  - type: cron
    name: meteo-ai-ml-cycle
    runtime: python
    rootDir: meteo-backend
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_ml_cycle.py
    schedule: "5 * * * *"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: "production"
      - key: ENABLE_SCHEDULER
        value: "false"
      - key: AUTO_LOAD_CITIES
        value: "false"
      - key: ML_CITY_SAMPLE_SIZE
        value: "800"
      - key: ML_CITY_CORE_SIZE
        value: "100"
      - key: ML_FORECAST_LEADS
        value: "1,3,6,14,38,86,158"
      - key: ML_CYCLE_EVERY_HOURS
        value: "1"
      - key: ML_OBSERVATION_RETENTION_DAYS
        value: "21"
      - key: ML_PREDICTION_RETENTION_DAYS
        value: "21"
      - key: PYTHON_VERSION
        value: "3.11.4"
