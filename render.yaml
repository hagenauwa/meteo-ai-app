services:
  - type: web
    name: meteo-ai-backend
    runtime: python
    rootDir: meteo-backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m alembic -c alembic.ini upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        sync: false        # imposta manualmente su Render dashboard
      - key: ADMIN_API_TOKEN
        sync: false        # richiesto per /api/admin/* e /api/ml/train
      - key: MODEL_SIGNING_KEY
        sync: false        # chiave dedicata firma modelli ML (HMAC su pickle).
                           # ATTENZIONE: impostandola si ruota la chiave di firma ->
                           # i modelli esistenti firmati con ADMIN_API_TOKEN non
                           # validano piu' e il ML si disabilita fino al riaddestramento.
                           # Al primo deploy con questa var impostata, lanciare un
                           # /api/ml/train subito dopo. Se non impostata, fallback a
                           # ADMIN_API_TOKEN (backward-compat).
      - key: FRONTEND_ORIGIN
        value: "https://leprevisioni.netlify.app"
      - key: APP_ENV
        value: "production"
      - key: ENABLE_SCHEDULER
        value: "false"
      - key: AUTO_LOAD_CITIES
        value: "false"
      - key: ML_CITY_SAMPLE_SIZE
        value: "800"
      - key: ML_CITY_CORE_SIZE
        value: "100"
      - key: ML_FORECAST_LEADS
        value: "1,3,6,14,38,86,158"
      - key: ML_CYCLE_EVERY_HOURS
        value: "1"
      - key: ML_OBSERVATION_RETENTION_DAYS
        value: "21"
      - key: ML_PREDICTION_RETENTION_DAYS
        value: "21"
      - key: TELEGRAM_BOT_TOKEN
        sync: false        # imposta manualmente su Render dashboard (da @BotFather)
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false        # imposta manualmente su Render dashboard (token segreto per webhook)
      - key: PYTHON_VERSION
        value: "3.11.4"

  - type: cron
    name: meteo-ai-ml-cycle
    runtime: python
    rootDir: meteo-backend
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_ml_cycle.py
    schedule: "5 * * * *"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: "production"
      - key: ENABLE_SCHEDULER
        value: "false"
      - key: AUTO_LOAD_CITIES
        value: "false"
      - key: ML_CITY_SAMPLE_SIZE
        value: "800"
      - key: ML_CITY_CORE_SIZE
        value: "100"
      - key: ML_FORECAST_LEADS
        value: "1,3,6,14,38,86,158"
      - key: ML_CYCLE_EVERY_HOURS
        value: "1"
      - key: ML_OBSERVATION_RETENTION_DAYS
        value: "21"
      - key: ML_PREDICTION_RETENTION_DAYS
        value: "21"
      - key: PYTHON_VERSION
        value: "3.11.4"

  - type: cron
    name: meteo-ai-telegram-notify
    runtime: python
    rootDir: meteo-backend
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_telegram_checks.py
    schedule: "0 * * * *"  # ogni ora allo :00
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: "production"
      - key: ENABLE_SCHEDULER
        value: "false"
      - key: AUTO_LOAD_CITIES
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.4"
