# Configurazione Netlify per Meteo AI App
# Documentazione: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Directory dove risiedono i file statici (HTML, CSS, JS)
  publish = "public"

  # Comando di build (vuoto perché è un sito statico)
  command = ""

# Headers di sicurezza
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://api.open-meteo.com https://geocoding-api.open-meteo.com https://meteo-ai-backend.onrender.com; worker-src 'self'; manifest-src 'self'"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Variabili d'ambiente (da configurare su Netlify dashboard)
[context.production.environment]
  NODE_ENV = "production"

[context.development.environment]
  NODE_ENV = "development"
